<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワークサポート・タロット鑑定アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Zen+Maru+Gothic:wght@400;700&display=swap');
        
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
        }
        .title-font {
            font-family: 'Cinzel', serif;
        }
        .tarot-card {
            perspective: 1000px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .tarot-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.5);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 92, 246, 0.8);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.4s ease forwards;
        }
    </style>
</head>
<body class="flex flex-col min-h-full">

    <header class="bg-slate-900/80 backdrop-blur-md border-b border-purple-500/35 sticky top-0 z-50 px-4 py-3 shadow-xl">
        <div class="max-w-7xl mx-auto flex flex-col lg:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-purple-600 to-indigo-700 flex items-center justify-center shadow-lg shadow-purple-500/40">
                    <i class="fa-solid fa-moon text-amber-300 text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold title-font tracking-wider bg-gradient-to-r from-purple-300 via-pink-300 to-amber-200 bg-clip-text text-transparent">Work Support Tarot</h1>
                    <p class="text-xs text-purple-300">78枚フル対応 ・ ワークサポート鑑定</p>
                </div>
            </div>
            
            <!-- Spread Selector Tabs -->
            <div class="flex flex-wrap justify-center gap-1 bg-slate-950/60 p-1.5 rounded-2xl border border-purple-500/20">
                <button onclick="selectSpread('one')" class="spread-btn px-2.5 py-1.5 text-xs font-bold rounded-xl transition-all bg-purple-600 text-white shadow-md" data-spread="one">1枚</button>
                <button onclick="selectSpread('two')" class="spread-btn px-2.5 py-1.5 text-xs font-bold rounded-xl transition-all text-purple-200 hover:bg-purple-900/50" data-spread="two">2枚(横)</button>
                <button onclick="selectSpread('three')" class="spread-btn px-2.5 py-1.5 text-xs font-bold rounded-xl transition-all text-purple-200 hover:bg-purple-900/50" data-spread="three">3枚(横)</button>
                <button onclick="selectSpread('four')" class="spread-btn px-2.5 py-1.5 text-xs font-bold rounded-xl transition-all text-purple-200 hover:bg-purple-900/50" data-spread="four">4枚(上1下3)</button>
                <button onclick="selectSpread('six')" class="spread-btn px-2.5 py-1.5 text-xs font-bold rounded-xl transition-all text-purple-200 hover:bg-purple-900/50" data-spread="six">6枚(上下3)</button>
                <button onclick="selectSpread('hexagram')" class="spread-btn px-2.5 py-1.5 text-xs font-bold rounded-xl transition-all text-purple-200 hover:bg-purple-900/50" data-spread="hexagram">ヘキサグラム(7枚)</button>
                <button onclick="selectSpread('celtic')" class="spread-btn px-2.5 py-1.5 text-xs font-bold rounded-xl transition-all text-purple-200 hover:bg-purple-900/50" data-spread="celtic">ケルト十字(10枚)</button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-4 md:p-6 grid grid-cols-1 xl:grid-cols-12 gap-6 items-start">
        
        <!-- Left Column: Controls & Spread Board (7 cols on xl) -->
        <section class="xl:col-span-7 flex flex-col gap-6 w-full min-w-0">
            
            <!-- Question & Config Card -->
            <div class="bg-slate-900/70 backdrop-blur-md border border-purple-500/30 rounded-3xl p-4 sm:p-5 shadow-2xl relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-32 h-32 bg-purple-600/10 rounded-full blur-2xl pointer-events-none"></div>
                
                <h2 class="text-sm font-bold text-purple-300 uppercase tracking-widest mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i> リーディング設定 & 質問
                </h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-slate-300 mb-1">仕事・キャリアに関するお悩みやテーマ（任意）</label>
                        <input type="text" id="userQuestion" placeholder="例: 新プロジェクトを成功させるには？ チーム内の人間関係を円滑にするには？" class="w-full bg-slate-950/80 border border-purple-500/30 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:border-purple-400 text-purple-100 placeholder-slate-500 transition-all">
                    </div>
                    
                    <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
                        <div class="text-xs text-purple-300 bg-purple-950/40 px-3 py-1.5 rounded-xl border border-purple-500/20">
                            選択中: <span id="currentSpreadName" class="font-bold text-amber-300">1枚引き</span>
                        </div>
                        
                        <div class="flex items-center gap-2">
                            <button onclick="drawTarot()" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-sm font-bold px-6 py-2.5 rounded-2xl shadow-lg shadow-purple-600/40 transition-all transform active:scale-95 flex items-center gap-2">
                                <i class="fa-solid fa-bolt"></i> カードを引く
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Spread Visualization Canvas Board -->
            <div class="bg-slate-900/70 backdrop-blur-md border border-purple-500/30 rounded-3xl p-3 sm:p-5 shadow-2xl min-h-[560px] flex flex-col items-center justify-center relative overflow-hidden w-full min-w-0">
                <div id="welcomeState" class="text-center py-16 space-y-4">
                    <div class="w-20 h-20 mx-auto rounded-full bg-purple-950/80 border border-purple-500/40 flex items-center justify-center shadow-xl animate-pulse">
                        <i class="fa-solid fa-hand-sparkles text-3xl text-purple-300"></i>
                    </div>
                    <h3 class="text-lg font-bold text-purple-200">タロット鑑定の準備ができました</h3>
                    <p class="text-xs text-slate-400 max-w-sm mx-auto">「カードを引く」ボタンを押すと、選択したスプレッドの配置通りにランダムでカードが展開されます。</p>
                </div>

                <!-- Spread layout container -->
                <div id="spreadContainer" class="w-full flex flex-col items-center justify-center gap-4 hidden overflow-x-auto p-1">
                    <!-- Cards injected dynamically -->
                </div>
            </div>

        </section>

        <!-- Right Column: Detailed Breakdown (5 cols on xl) -->
        <section class="xl:col-span-5 flex flex-col gap-6">
            <div class="bg-slate-900/70 backdrop-blur-md border border-purple-500/30 rounded-3xl p-6 shadow-2xl h-full flex flex-col">
                <div class="flex items-center justify-between pb-4 border-b border-purple-500/20 mb-4">
                    <h2 class="text-sm font-bold text-purple-300 uppercase tracking-widest flex items-center gap-2">
                        <i class="fa-solid fa-book-bookmark text-amber-400"></i> ワークサポート鑑定結果
                    </h2>
                    <span id="selectedCardCount" class="text-xs bg-purple-950/80 text-purple-200 px-3 py-1 rounded-xl border border-purple-500/30">0枚選択中</span>
                </div>

                <!-- Explanation Feed -->
                <div id="explanationFeed" class="flex-1 overflow-y-auto space-y-4 max-h-[720px] pr-1">
                    <div class="text-center py-20 text-slate-500 space-y-2">
                        <i class="fa-solid fa-feather text-3xl opacity-40"></i>
                        <p class="text-xs">カードを引くと、ここに各ポジションの詳細な意味やサポート情報が即座に表示されます。</p>
                    </div>
                </div>
            </div>
        </section>

    </main>

                                <div class="col-span-2 flex justify-center">${createCardHtml(currentDrawnCards[9], true)}</div>
                            </div>

                            <!-- 2段目: 中央に【顕在意識】(3) [現在1の真上] / 右端に【どうなりたいか】(8) -->
                            <div class="grid grid-cols-10 gap-1 items-center">
                                <div class="col-span-3"></div>
                                <div class="col-span-2 flex justify-center">${createCardHtml(currentDrawnCards[3], true)}</div>
                                <div class="col-span-3"></div>
                                <div class="col-span-2 flex justify-center">${createCardHtml(currentDrawnCards[8], true)}</div>
                            </div>

                            <!-- 3段目: 左から【過去】(0)、【現在】(1)、【未来】(2) / 右端に【周囲】(7) -->
                            <div class="grid grid-cols-10 gap-1 items-center">
                                <div class="col-span-2 flex justify-center">${createCardHtml(currentDrawnCards[0], true)}</div>
                                <div class="col-span-2 flex justify-center">${createCardHtml(currentDrawnCards[1], true)}</div>
                                <div class="col-span-2 flex justify-center">${createCardHtml(currentDrawnCards[2], true)}</div>
                                <div class="col-span-2"></div>
                                <div class="col-span-2 flex justify-center">${createCardHtml(currentDrawnCards[7], true)}</div>
                            </div>

                            <!-- 4段目: 中央に【潜在意識】(4) [現在1の真下] / 右に【原因】(6) -->
                            <div class="grid grid-cols-10 gap-1 items-center">
                                <div class="col-span-3"></div>
                                <div class="col-span-2 flex justify-center">${createCardHtml(currentDrawnCards[4], true)}</div>
                                <div class="col-span-3"></div>
                                <div class="col-span-2 flex justify-center">${createCardHtml(currentDrawnCards[6], true)}</div>
                            </div>

                            <!-- 5段目: 【原因】の左横に【障害】(5) -->
                            <div class="grid grid-cols-10 gap-1 items-center">
                                <div class="col-span-6"></div>
                                <div class="col-span-2 flex justify-center">${createCardHtml(currentDrawnCards[5], true)}</div>
                                <div class="col-span-2"></div>
                            </div>

                        </div>
                    </div>
                `;
            } else {
                html = `<div class="flex flex-wrap justify-center gap-3 sm:gap-4 w-full">`;
                currentDrawnCards.forEach(card => {
                    html += createCardHtml(card);
                });
                html += `</div>`;
            }

            spreadContainer.innerHTML = html;
        }

        function createCardHtml(card, isCompact = false) {
            const rotationStyle = card.isReversed ? 'transform: rotate(180deg);' : '';
            
            // Expanded card image box to prevent clipping and ensure vertical tarot ratio
            const cardWidthClass = isCompact ? 'w-16 sm:w-20' : 'w-24 sm:w-28 md:w-32';
            const imgHeightClass = isCompact ? 'h-28 sm:h-36' : 'h-36 sm:h-48 md:h-52';

            const imgContent = `
                <img src="${card.image}" 
                     onerror="this.onerror=null; this.src='https://placehold.co/200x340/1e1b4b/c084fc?text=${encodeURIComponent(card.name.split(' ')[0])}';" 
                     class="w-full ${imgHeightClass} object-cover rounded-lg border border-purple-400/40 bg-slate-950" 
                     alt="${card.name}">
            `;

            return `
                <div class="tarot-card bg-slate-950/90 border border-purple-500/30 rounded-xl p-1 sm:p-1.5 ${cardWidthClass} flex flex-col items-center shadow-lg animate-fadeIn">
                    <div class="text-[8px] sm:text-[9px] font-bold text-amber-300 mb-0.5 text-center truncate w-full" title="${card.positionLabel}">${card.positionLabel}</div>
                    <div class="w-full mb-1 transition-transform duration-500" style="${rotationStyle}">
                        ${imgContent}
                    </div>
                    <div class="text-[9px] sm:text-xs font-bold text-purple-100 text-center truncate w-full" title="${card.name}">${card.name}</div>
                    <div class="text-[7px] sm:text-[8px] text-purple-300 mt-0.5">${card.isReversed ? '【逆位置】' : '【正位置】'}</div>
                </div>
            `;
        }

        function renderExplanations() {
            const feed = document.getElementById('explanationFeed');
            document.getElementById('selectedCardCount').innerText = `${currentDrawnCards.length}枚選択中`;

            let html = '';
            currentDrawnCards.forEach((card, idx) => {
                html += `
                    <div class="bg-slate-950/80 border border-purple-500/30 rounded-2xl p-4 shadow-lg space-y-3 relative overflow-hidden group hover:border-purple-400/60 transition-all animate-fadeIn">
                        <div class="absolute top-0 left-0 w-1.5 h-full bg-gradient-to-b from-purple-500 to-indigo-600"></div>
                        
                        <div class="flex items-center justify-between border-b border-purple-500/20 pb-2">
                            <div>
                                <span class="text-[10px] font-bold bg-purple-950 text-amber-300 px-2.5 py-0.5 rounded-full border border-purple-500/30">${card.positionLabel}</span>
                                <h4 class="text-sm font-bold text-purple-100 mt-1">${card.displayName}</h4>
                            </div>
                            <div class="w-8 h-8 rounded-full bg-purple-900/40 flex items-center justify-center text-purple-300 text-xs font-bold border border-purple-500/20">
                                #${idx + 1}
                            </div>
                        </div>

                        <div class="grid grid-cols-1 gap-2 text-xs">
                            <div class="flex items-start gap-2 bg-slate-900/50 p-2 rounded-xl border border-purple-500/10">
                                <i class="fa-solid fa-eye text-amber-400 mt-0.5 w-4 text-center"></i>
                                <div><strong class="text-purple-300">象徴:</strong> <span class="text-slate-300">${card.symbol}</span></div>
                            </div>
                            <div class="flex items-start gap-2 bg-slate-900/50 p-2 rounded-xl border border-purple-500/10">
                                <i class="fa-solid fa-lightbulb text-purple-400 mt-0.5 w-4 text-center"></i>
                                <div><strong class="text-purple-300">意味（仕事・サポート）:</strong> <span class="text-slate-200">${card.adjustedMeaning}</span></div>
                            </div>
                            <div class="flex items-start gap-2 bg-slate-900/50 p-2 rounded-xl border border-purple-500/10">
                                <i class="fa-solid fa-location-dot text-indigo-400 mt-0.5 w-4 text-center"></i>
                                <div><strong class="text-purple-300">場所:</strong> <span class="text-slate-300">${card.adjustedLocation}</span></div>
                            </div>
                            <div class="flex items-start gap-2 bg-slate-900/50 p-2 rounded-xl border border-purple-500/10">
                                <i class="fa-solid fa-box-archive text-pink-400 mt-0.5 w-4 text-center"></i>
                                <div><strong class="text-purple-300">雑貨や物:</strong> <span class="text-slate-300">${card.adjustedGoods}</span></div>
                            </div>
                            <div class="flex items-start gap-2 bg-slate-900/50 p-2 rounded-xl border border-purple-500/10">
                                <i class="fa-solid fa-seedling text-emerald-400 mt-0.5 w-4 text-center"></i>
                                <div><strong class="text-purple-300">ハーブ:</strong> <span class="text-slate-300">${card.adjustedHerb}</span></div>
                            </div>
                        </div>
                    </div>
                `;
            });

            feed.innerHTML = html;
        }

        window.onload = function() {
            selectSpread('one');
        };
    </script>
</body>
</html>
